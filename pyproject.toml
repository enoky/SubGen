[project]
name = "subgen"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "deepmultilingualpunctuation>=1.0.1",
    "en-core-web-lg",
    "gradio>=6.31.0",
    "nvidia-cublas-cu12>=12.9.2.10 ; sys_platform == 'win32'",
    "openai-whisper>=20250625",
    "pillow>=12.2.0",
    "setuptools-rust>=1.12.1",
    "spacy>=3.8,<3.9",
    "srt>=3.5.3",
    "torch>=2.15.0",
    "torchaudio>=2.11.1",
    "torchvision>=0.29.1",
    "tqdm>=4.67.3",
    "whisperx>=3.7.2",
]

[tool.uv.sources]
en-core-web-lg = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_lg-3.8.0/en_core_web_lg-3.8.0-py3-none-any.whl" }
torch = { index = "pytorch-cu132" }
torchaudio = { index = "pytorch-cu132" }
torchvision = { index = "pytorch-cu132" }

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]

[tool.pytest.ini_options]
pythonpath = ["."]
